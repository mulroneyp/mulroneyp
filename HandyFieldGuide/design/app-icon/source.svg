<?xml version="1.0" encoding="UTF-8"?>
<!--
  Handy Field Guide — App Icon vector sketch
  One character: blue bird looking through black binoculars (not bird beside separate optics).
  Matches composition of source-1024.png (authoritative raster from Paul’s artwork).
  Export sizes: python3 scripts/generate_app_icon.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Handy Field Guide app icon: blue bird looking through binoculars">
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Bird body (bright blue) — ~10% margin from edges -->
  <g>
    <!-- body -->
    <ellipse cx="512" cy="560" rx="250" ry="280" fill="#3BB4F0"/>
    <!-- belly highlight -->
    <ellipse cx="512" cy="620" rx="150" ry="170" fill="#6EC8F7"/>
    <!-- head -->
    <circle cx="512" cy="360" r="170" fill="#3BB4F0"/>
    <!-- crest tuft -->
    <path d="M470 220 Q512 150 554 220 Q512 185 470 220 Z" fill="#3BB4F0"/>
    <!-- eyes above bins -->
    <circle cx="455" cy="320" r="28" fill="#0A0A0A"/>
    <circle cx="569" cy="320" r="28" fill="#0A0A0A"/>
    <circle cx="445" cy="308" r="8" fill="#FFFFFF"/>
    <circle cx="559" cy="308" r="8" fill="#FFFFFF"/>
    <!-- beak peeking under bins -->
    <polygon points="512,390 545,410 512,425 479,410" fill="#F0B030"/>
    <!-- wings holding bins -->
    <ellipse cx="300" cy="430" rx="70" ry="55" transform="rotate(-20 300 430)" fill="#2A9AD8"/>
    <ellipse cx="724" cy="430" rx="70" ry="55" transform="rotate(20 724 430)" fill="#2A9AD8"/>
    <!-- feet -->
    <ellipse cx="450" cy="820" rx="35" ry="18" fill="#F0A020"/>
    <ellipse cx="574" cy="820" rx="35" ry="18" fill="#F0A020"/>
  </g>

  <!-- Binoculars held to eyes -->
  <g>
    <!-- left tube -->
    <rect x="360" y="340" width="130" height="150" rx="45" fill="#1A1A1A"/>
    <!-- right tube -->
    <rect x="534" y="340" width="130" height="150" rx="45" fill="#1A1A1A"/>
    <!-- bridge -->
    <rect x="470" y="385" width="84" height="55" rx="16" fill="#0D0D0D"/>
    <!-- focus dial -->
    <circle cx="512" cy="412" r="14" fill="#E8C040"/>
    <!-- objective lenses -->
    <circle cx="425" cy="400" r="48" fill="#0A2840"/>
    <circle cx="599" cy="400" r="48" fill="#0A2840"/>
    <circle cx="425" cy="400" r="38" fill="#123A5C"/>
    <circle cx="599" cy="400" r="38" fill="#123A5C"/>
    <!-- glints -->
    <path d="M400 375 Q415 365 430 375" fill="none" stroke="#7EC8F0" stroke-width="6" stroke-linecap="round"/>
    <path d="M574 375 Q589 365 604 375" fill="none" stroke="#7EC8F0" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
