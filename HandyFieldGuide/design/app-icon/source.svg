<?xml version="1.0" encoding="UTF-8"?>
<!--
  Handy Field Guide — App Icon vector sketch
  Matches the composition of source-1024.png (authoritative raster).
  Palette aligns with HandyFieldGuide/Theme.swift GuideColor.
  Rasterize / export sizes with: python3 scripts/generate_app_icon.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Handy Field Guide app icon: bird perched on binoculars">
  <rect width="1024" height="1024" fill="#1B3330"/>

  <!-- Binoculars -->
  <g>
    <rect x="280" y="430" width="190" height="420" rx="70" fill="#9A4630"/>
    <rect x="554" y="430" width="190" height="420" rx="70" fill="#9A4630"/>
    <!-- barrel highlights -->
    <rect x="300" y="460" width="50" height="280" rx="25" fill="#B05C44"/>
    <rect x="574" y="460" width="50" height="280" rx="25" fill="#B05C44"/>
    <!-- bridge -->
    <rect x="430" y="520" width="164" height="100" rx="28" fill="#763424"/>
    <circle cx="512" cy="570" r="28" fill="#9A4630"/>
    <circle cx="512" cy="570" r="16" fill="#F3EEE4"/>
    <!-- objectives -->
    <circle cx="375" cy="800" r="70" fill="#121E1C"/>
    <circle cx="649" cy="800" r="70" fill="#121E1C"/>
    <circle cx="375" cy="800" r="58" fill="none" stroke="#D8CFC0" stroke-width="8"/>
    <circle cx="649" cy="800" r="58" fill="none" stroke="#D8CFC0" stroke-width="8"/>
    <!-- eyepieces -->
    <circle cx="375" cy="450" r="52" fill="#763424"/>
    <circle cx="649" cy="450" r="52" fill="#763424"/>
    <circle cx="375" cy="450" r="32" fill="#121E1C"/>
    <circle cx="649" cy="450" r="32" fill="#121E1C"/>
  </g>

  <!-- Bird perched on left eyepiece / bridge -->
  <g>
    <ellipse cx="430" cy="300" rx="120" ry="95" fill="#F3EEE4"/>
    <circle cx="530" cy="250" r="72" fill="#F3EEE4"/>
    <ellipse cx="410" cy="320" rx="70" ry="55" fill="#FBF7F0"/>
    <polygon points="585,235 680,255 585,278" fill="#9A4630"/>
    <circle cx="545" cy="240" r="14" fill="#1C2820"/>
    <circle cx="549" cy="236" r="5" fill="#FFFCF5"/>
    <polygon points="320,300 250,320 260,355 335,340" fill="#F3EEE4"/>
    <path d="M360 280 Q450 360 520 290" fill="none" stroke="#3D4A42" stroke-width="8" stroke-linecap="round"/>
    <g stroke="#9A4630" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="400" y1="385" x2="390" y2="445"/>
      <line x1="450" y1="390" x2="460" y2="445"/>
      <line x1="375" y1="445" x2="410" y2="445"/>
      <line x1="445" y1="445" x2="480" y2="445"/>
    </g>
  </g>
</svg>
